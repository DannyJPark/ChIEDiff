[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gated-energy-diffusion"
version = "2.0.3"
description = "Chemistry-gated interaction-energy diffusion for structure-based 3D molecular generation"
readme = "README.md"
requires-python = ">=3.9,<3.10"
# MIT throughout, except gated_energy_diffusion/utils/reconstruct.py, which is GPL-2.0 and
# keeps its own header. NOTICE.md records it and ships in the distribution.
license = { file = "LICENSE" }
keywords = [
    "structure-based drug design",
    "3D molecular generation",
    "diffusion models",
    "protein-ligand interactions",
    "physics-informed learning",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch, torch-geometric and torch-scatter are deliberately NOT listed. They need a wheel
# matched to the local CUDA build (torch 1.11.0 + cu113 here) and pip cannot pick that
# correctly from an index alone. Install the environment from envs/environment-train.yml
# first, then `pip install --no-deps -e .` into it.
dependencies = [
    # rdkit comes from pip in envs/environment-train.yml and the package imports it directly
    # (utils/data.py, utils/reconstruct.py, utils/evaluation/*), so it belongs here.
    "rdkit==2024.3.6",
    "numpy>=1.23,<1.24",   # load-bearing: utils/data.py uses np.long and np.bool,
                           # both removed in numpy 1.24
    "pandas==2.1.4",
    "scipy>=1.7.3,<2.0.0",
    "pyyaml",
    "easydict",
    "lmdb",
    "tqdm",
    "biopython",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tensorboard==2.9.0",
    "protobuf<=3.20.3",
]

[project.optional-dependencies]
# Optional experiment tracking; the trainer runs without it.
wandb = ["wandb"]

[[project.authors]]
name = "Hyoungjoon Park"

[[project.authors]]
name = "Seungyeon Choi"

[[project.authors]]
name = "Hwanhee Kim"

[[project.authors]]
name = "Seungyong Lee"

[[project.authors]]
name = "Yoonju Kim"

[[project.authors]]
name = "Taeil Noh"

[[project.authors]]
name = "Minjae Lee"

[[project.authors]]
name = "Sanghyun Park"
email = "sanghyun@yonsei.ac.kr"

[project.urls]
Homepage = "https://github.com/DannyJPark/ChIEDiff"
Software-archive = "https://doi.org/10.5281/zenodo.23793804"
Data-archive = "https://doi.org/10.5281/zenodo.23029438"

[tool.setuptools.packages.find]
include = ["gated_energy_diffusion*"]

[tool.setuptools.package-data]
"gated_energy_diffusion.utils.evaluation" = ["*.pkl.gz"]

# No console_scripts: bin/train.py and bin/sample.py are run directly, as
# `python bin/train.py --config configs/train.yml`.
